name: Dependency Security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Synchronize dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies=false
      - name: Install without mutating the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies=false
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level high
