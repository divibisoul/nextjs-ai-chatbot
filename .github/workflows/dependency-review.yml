name: Dependency Review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Preserve lockfile input for regeneration diff
        run: cp pnpm-lock.yaml pnpm-lock-before.yaml

      - name: Regenerate dependency lockfile
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          echo "::group::Audited pnpm lockfile delta from declared overrides"
          git diff -- pnpm-lock.yaml
          echo "::endgroup::"


      - name: Audit high severity dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high > pnpm-audit.txt 2>&1
          audit_status=$?
          cat pnpm-audit.txt
          if [ "$audit_status" -eq 0 ]; then
            echo "SECURITY_AUDIT: PASS"
            exit 0
          fi
          node scripts/validate-pnpm-audit-gate.mjs pnpm-audit.txt

      - name: Upload security audit and regenerated lockfile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-security-audit-${{ github.run_id }}
          path: |
            pnpm-audit.txt
            pnpm-lock.yaml
            pnpm-lock-before.yaml
          if-no-files-found: error
          retention-days: 3
