name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate dependency lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts


      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high

      - name: Persist repaired lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(n05): persist audited dependency lockfile"
          git push origin HEAD:feat/soul-n05-n07-activation

