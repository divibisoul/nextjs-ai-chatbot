name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate dependency lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts


      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high
