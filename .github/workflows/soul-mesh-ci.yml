name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full Typecheck
        run: pnpm run typecheck
      - name: Mesh Typecheck
        run: pnpm run typecheck:mesh
      - name: Mesh unit tests
        run: pnpm run test:mesh
      - name: Production build
        run: pnpm run build
